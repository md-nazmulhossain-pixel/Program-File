<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transport Operation File-October 2026</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202a;--mute:#5a6978;--line:#cdd5de;--ok:#18794a;--blue:#1d5fa8;--warn:#c76a00;--bad:#b3261e;--nb:#fff4e0;--ni:#7a4300}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#19212a;--ink:#e7ecf1;--mute:#9aa8b6;--line:#2c3844;--ok:#4cc38a;--blue:#7fb8f2;--warn:#f0a040;--bad:#ff8a80;--nb:#3a2b12;--ni:#f4d19a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 "Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px}
button{padding:8px 16px;cursor:pointer;font-weight:600}
[hidden]{display:none!important}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 18px;background:linear-gradient(120deg,#082f55,#1668b0 70%,#2a8bd6);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{display:flex;gap:10px;align-items:center;margin-right:8px}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.brand b{display:block;font-size:18px;letter-spacing:.3px}.brand small{opacity:.85;font-size:12px}
.sb{position:relative;flex:1;min-width:200px;max-width:340px}
.lg{height:38px;width:auto;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.sb input{width:100%;padding:11px 14px 11px 40px;font-size:17px;border:0;border-radius:999px;color:#111;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sb::before{content:"⌕";position:absolute;left:14px;top:5px;font-size:24px;color:#6b7785}
.hd button{border:0;border-radius:999px;padding:10px 20px}
#nowb{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5)}
#sv{background:#ffd54a;color:#1b1b1b}
#cf{background:transparent;color:#fff;border:1px dashed rgba(255,255,255,.6);padding:8px 14px}
.eb{margin:10px 18px 0;padding:9px 14px;border-radius:8px;background:var(--bad);color:#fff;font-weight:600}
.pn{margin:12px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px 18px}
.vr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vno{font-size:34px;font-weight:800;letter-spacing:.5px;line-height:1}
.chip{padding:4px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:700}
.stb{padding:5px 16px;border-radius:999px;font-weight:700;color:#fff;background:var(--warn)}
.stb.s0{background:#6b7785}.stb.s6{background:var(--blue)}.stb.s7{background:var(--ok)}
.sp{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sp span,.sp button{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mute);background:var(--bg)}
.sp button.dn{color:var(--ok);border-color:var(--ok);cursor:pointer}
.sp .cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.ef{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;align-items:flex-end}
.fld label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:3px}
.fld input,.fld select{min-height:38px;padding:5px 10px;min-width:150px}
.fld.w input{min-width:260px}
.fld input:focus,.fld select:focus{outline:2px solid #2a8bd6;outline-offset:0}
.rule{margin-top:12px;padding:9px 14px;border-radius:10px;background:var(--nb);color:var(--ni);font-size:13px}
.rule button{margin-left:10px;background:var(--ok);color:#fff;border:0}
.pick b{display:block;margin-bottom:8px}.pick button{margin:0 6px 6px 0}
#gw{flex:1;overflow:auto;margin-top:6px;border-top:1px solid var(--line)}
table.sh{border-collapse:collapse;font-size:11.5px;white-space:nowrap;min-width:max-content}
.sh th{position:sticky;top:0;color:#fff;padding:5px 4px;border:1px solid rgba(0,0,0,.25);text-align:center;vertical-align:middle;width:92px;min-width:72px;max-width:104px;z-index:2;font-weight:600;white-space:normal;overflow-wrap:anywhere;line-height:1.2;cursor:pointer}
.sh th.fo{outline:2px solid rgba(255,255,255,.8);outline-offset:-3px}
.stt{display:flex;flex-wrap:wrap;gap:10px;margin:12px 18px 0}
.sbn{--c:#2563eb;--i:0;display:flex;align-items:center;gap:9px;padding:7px 8px 7px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:var(--card);font-weight:700;font-size:14px;transition:transform .18s,box-shadow .18s,background .25s,color .25s;animation:sin .5s both;animation-delay:calc(var(--i)*70ms)}
.sbn:hover{transform:translateY(-3px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 38%,transparent)}
.sbn:active{transform:scale(.96)}
.sbn .dot{width:9px;height:9px;border-radius:50%;background:var(--c);animation:pls 1.8s infinite}
.sbn .ct{min-width:34px;padding:2px 10px;border-radius:999px;background:var(--c);color:#fff;font-size:14px;text-align:center}
.sbn.on{background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 10px 22px color-mix(in srgb,var(--c) 50%,transparent)}
.sbn.on .ct{background:#fff;color:var(--c)}.sbn.on .dot{background:#fff;animation:none}
.sbn.all{--c:#475569;padding-right:14px}.sbn.all .dot,.sbn.all .ct{display:none}
.ct.pop{animation:pop .5s}
@keyframes pls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 65%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes sin{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.4)}}
@media(prefers-reduced-motion:reduce){.sbn,.sbn *{animation:none!important;transition:none!important}}
.cnt{margin:8px 18px 0;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnt button{padding:2px 12px;font-size:12px}
#fp{position:fixed;z-index:30;width:262px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);padding:10px}
#fp input[type=text]{width:100%;padding:7px 10px;min-height:36px}
.fl{max-height:250px;overflow:auto;margin:8px 0;font-size:13px}
.fl label{display:flex;gap:7px;align-items:center;padding:3px 4px;cursor:pointer;border-radius:6px}
.fl label:hover{background:var(--bg)}
.fa{display:flex;gap:6px}.fa button{padding:5px 10px;font-size:12px}
.sh tr.pin td{background:#fff4c9;color:#000}
@media(prefers-color-scheme:dark){.sh tr.pin td{background:#3b3614;color:#f3ecc0}}
.sh tr.pl td{border-bottom:3px solid var(--blue)}
.sh td{padding:3px 5px;border:1px solid var(--line);text-align:center;background:var(--card)}
.sh tr{cursor:pointer}.sh tr:hover td{background:var(--bg)}
.sh tr.on td,.sh tr.pin.on td{background:#cfe8ff;color:#000}
.sh td.st{color:var(--blue);font-weight:700}.sh tr.on td.st{color:#0b3d7a}
.sh td.du{color:var(--bad)}
.sh th.f0,.sh td.f0,.sh th.f1,.sh td.f1,.sh th.f2,.sh td.f2{width:48px;min-width:48px;max-width:48px}
.sh th.f3,.sh td.f3{width:145px;min-width:145px;max-width:145px}
.sh th.f4,.sh td.f4{width:88px;min-width:88px;max-width:88px}
.sh td.f0,.sh td.f1,.sh td.f2,.sh td.f3,.sh td.f4{position:sticky;z-index:1}
.sh th.f0,.sh th.f1,.sh th.f2,.sh th.f3,.sh th.f4{z-index:4}
.f0{left:0}.f1{left:48px}.f2{left:96px}.f3{left:144px}.f4{left:289px;box-shadow:3px 0 4px rgba(0,0,0,.25)}
.sh td.vn{font-weight:800;font-size:14px;color:#0b3d91;letter-spacing:.3px}
.sh tr.on td.vn{color:#0b2a66}
@media(prefers-color-scheme:dark){.sh td.vn{color:#8fc5ff}}
.nowi{background:var(--blue);color:#fff;border:0;min-height:38px}
.np{margin-left:4px;background:var(--ok);color:#fff;border:0}
.np:disabled{background:var(--bg);color:var(--mute);border:1px solid var(--line);cursor:not-allowed}
.h1{--g:#2f4bd6}.h2{--g:#3f7fd9}.h3{--g:#5a9c3e}.h4{--g:#3f8f25}.h5{--g:#9cc21f;color:#111!important;text-shadow:none!important}.h6{--g:#9b27c4}.h8{--g:#2f9fb3}.h9{--g:#e8822a}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:20px;z-index:20}
#rl,#themeBtn,#vsb{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5)}
/* Explicit theme palettes: default is the requested deep navy look */
html[data-theme="dark"]{color-scheme:dark;--bg:#071a2f;--card:#102943;--ink:#eaf2fb;--mute:#a9bfd4;--line:#29445f;--ok:#4cc38a;--blue:#80bfff;--warn:#f0ad55;--bad:#ff8b83;--nb:#3a2e1a;--ni:#ffe0a3}
html[data-theme="light"]{color-scheme:light;--bg:#eef1f5;--card:#fff;--ink:#16202a;--mute:#5a6978;--line:#cdd5de;--ok:#18794a;--blue:#1d5fa8;--warn:#c76a00;--bad:#b3261e;--nb:#fff4e0;--ni:#7a4300}
html[data-theme="dark"] .sh tr.pin td{background:#3b3614;color:#f3ecc0}
html[data-theme="light"] .sh tr.pin td{background:#fff4c9;color:#000}
html[data-theme="dark"] .sh td.vn{color:#8fc5ff}
html[data-theme="light"] .sh td.vn{color:#0b3d91}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:9;font-weight:600}

/* ===== Dynamic headings ===== */
.sh th{background:linear-gradient(180deg,rgba(255,255,255,.30) 0,rgba(255,255,255,.06) 50%,rgba(0,0,0,.22) 100%),var(--g,#2f4bd6);border:0;border-right:1px solid rgba(255,255,255,.2);padding:7px 9px 8px;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);overflow:hidden;transition:filter .2s,letter-spacing .2s}
.sh th.f4{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),3px 0 4px rgba(0,0,0,.25)}
.sh th::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.sh th::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:3px;background:#fff;border-radius:3px;transform:translateX(-50%);transition:width .25s}
.sh th:hover{filter:brightness(1.16);letter-spacing:.35px}
.sh th:hover::before{transform:translateX(130%);transition:transform .7s ease}
.sh th:hover::after{width:72%}
.sh th:active{filter:brightness(.95)}
.sh th.op{filter:brightness(1.25)}.sh th.op::after{width:100%}
.sh th.fo{font-weight:800;box-shadow:inset 0 -4px 0 #ffd54a,inset 0 0 0 2px #ffd54a;animation:fglow 1.8s ease-in-out infinite}
.sh th.fo::after{width:100%;background:#ffd54a}
.sh th .fb{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ffd54a;color:#1b1b1b;font:800 9px/16px system-ui,sans-serif;text-shadow:none;animation:bpop .45s}
@keyframes fglow{0%,100%{box-shadow:inset 0 -4px 0 #ffd54a,inset 0 0 0 2px #ffd54a}50%{box-shadow:inset 0 -4px 0 #fff3b0,inset 0 0 0 2px #fff3b0,0 0 12px rgba(255,213,74,.8)}}
@keyframes bpop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes thin{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.sh.intro th{animation:thin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*22ms)}
.sh td.fc{background:color-mix(in srgb,#ffd54a 15%,var(--card))}
.sh tr.hl td{background:color-mix(in srgb,var(--blue) 26%,var(--card))}
.fchip{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;background:#ffd54a;color:#1b1b1b;font-weight:700;font-size:12px;cursor:pointer;animation:bpop .3s}
.fchip:hover{filter:brightness(.92)}
#fp{transform-origin:top left;animation:fpin .16s ease-out}
@keyframes fpin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sh th,.sh th::before,.sh th::after,.sh th .fb,#fp,.fchip{animation:none!important;transition:none!important}}

/* ===== Vehicle Status view ===== */
#vs{flex:1;overflow:auto;margin:12px 18px 16px;animation:fpin .25s ease-out}
.vst{max-width:1500px;margin:0 auto}
.vst h2{margin:4px 0 4px;text-align:center;font-size:24px;letter-spacing:.3px}
.vst .sub{text-align:center;color:var(--mute);margin-bottom:12px;font-size:13px}
.vst .sub b{color:#e53935}
.vst table{border-collapse:collapse;width:100%;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px}
.vst th{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#a64dff,#7a14d6);color:#fff;padding:8px 8px;font-weight:700;border:1px solid rgba(0,0,0,.3);text-shadow:0 1px 1px rgba(0,0,0,.35);line-height:1.2}
.vst td{padding:3px 6px;border:1px solid var(--line);text-align:center;height:30px}
.vst td.vno{font-weight:800;font-size:14px;letter-spacing:.3px}
.vst td.ps{text-align:left;font-weight:700;white-space:nowrap}
.vst td.ed{padding:0;min-width:120px}
.vst td.ed.w{min-width:200px}
.vst td.ed input{width:100%;height:100%;min-height:28px;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;font-weight:600;padding:3px 7px}
.vst td.ed input:focus{outline:2px solid #a64dff;outline-offset:-2px;background:var(--card);color:var(--ink)}
.vst tr:hover td{filter:brightness(1.08)}
.vst tr.red td:nth-child(-n+9){background:#e53935;color:#fff;font-weight:700;border-color:#7a0f0c}
.vst tr.red td:nth-child(-n+9) input{color:#fff}
.vst tr.red td:nth-child(-n+9) input:focus{color:var(--ink)}
.vst .sc{display:inline-block;padding:1px 10px;border-radius:999px;color:#fff;background:var(--c,#6b7785);font-size:12px;border:1px solid rgba(255,255,255,.6)}
.vst .none{padding:26px;text-align:center;color:var(--mute)}

/* ===== Menu bar (hover dropdown) ===== */
.hd{position:relative;z-index:35}.mn{position:relative}
.mn>span{display:inline-block;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);font-weight:700;cursor:pointer;user-select:none;color:#fff}
.md{display:none;position:absolute;top:100%;left:0;min-width:250px;padding-top:8px;z-index:40}
.md>div{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.35);padding:6px;animation:mdn .18s ease-out;transform-origin:top}
.mn:hover .md,.mn.open .md{display:block}.mn.shut .md{display:none!important}
.md p{margin:0;padding:9px 14px;border-radius:9px;color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.md p:hover{background:var(--bg);color:var(--blue)}.md p.on{background:var(--blue);color:var(--card)}
.md hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
@keyframes mdn{from{opacity:0;transform:translateY(-8px) scaleY(.9)}}
/* ===== Report views ===== */
#rp{flex:1;overflow:auto;margin:12px 18px 16px;animation:fpin .25s ease-out}
.rpt{max-width:1500px;margin:0 auto}.rh{text-align:center;margin-bottom:10px}.rh h2{margin:4px 0;font-size:26px;letter-spacing:.3px}
.rh .sub{color:var(--mute);font-size:13px}.rh .sub button{padding:3px 12px;margin-left:8px;font-size:12px}
.kp{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.kc{--c:#2563eb;min-width:150px;padding:10px 18px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent);text-align:center}
.kc b{display:block;font-size:28px;line-height:1.1}.kc span{font-size:12px;opacity:.92}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px;align-items:start}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:auto}
.rc.rw{max-width:1100px;margin:0 auto}.rc h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc h3 input{min-height:32px;padding:2px 8px}
.rt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px;margin-bottom:12px}
.rt th{background:linear-gradient(180deg,#2f6fd6,#1b4aa0);color:#fff;padding:6px 3px;border:1px solid rgba(0,0,0,.2);font-weight:700}
.rt td{padding:4px 3px;border:1px solid var(--line);text-align:center}.rt td:first-child{text-align:left;font-weight:600;padding-left:8px;overflow-wrap:anywhere}.rt th:first-child,.rt td:first-child{width:210px}
.rt td.z{color:var(--mute);opacity:.55}.rt td:last-child{font-weight:800;background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.rt tr:hover td{filter:brightness(1.07)}
.rt tr.t td{background:color-mix(in srgb,#f59e0b 24%,var(--card));font-weight:800}
.rt tr.gt td{background:#18794a;color:#fff;font-weight:800;opacity:1}
.rt tr.mm td{color:var(--bad);font-weight:700}
.rn{padding:10px 14px;border-radius:10px;background:var(--nb);color:var(--ni);font-size:13px;margin:8px auto 12px;max-width:1100px}
@media print{@page{size:A4 landscape;margin:8mm}.hd,#err,.sub button{display:none!important}html,body{height:auto}#rp{overflow:visible;margin:0}.rg{grid-template-columns:1fr 1fr}}

      if(!j.ok){if(j.code!=="BUSY")msg(j.error);panel();if(j.code==="CONFLICT"||j.code==="BUSY")loadAll(true,true);return}
      ok(j); // সার্ভারের নিশ্চিত উত্তরের পর সঙ্গে সঙ্গে UI আপডেট; পরবর্তী স্বাভাবিক সিঙ্কে অন্যদের পরিবর্তন আসবে
    }).catch(e=>{const nt2=$("#pn [data-new]");if(nt2)nt2.disabled=false;panel();loadAll(true,true);msg("নতুন প্রোগ্রামের অনুরোধের উত্তর পাওয়া যায়নি। Reload করে দেখুন প্রোগ্রাম তৈরি হয়েছে কি না। বিস্তারিত: "+e.message)});
  };
  if(!sel)return msg("প্রথমে গাড়ি বাছুন।");
  if(!LIVE)return beginNew();
  // ক্লিকের আগে আলাদা full-sheet reload নয়; সার্ভার lock ও latest data দিয়ে যাচাই করবে।
  return beginNew();
}

(function initTheme(){
  const root=document.documentElement,btn=$("#themeBtn");
  let saved="dark";
  try{saved=localStorage.getItem("programEntryTheme")||"dark"}catch(e){}
  function applyTheme(theme){
    theme=theme==="light"?"light":"dark";
    root.setAttribute("data-theme",theme);
    btn.textContent=theme==="dark"?"☀️ Light":"🌙 Dark";
    btn.setAttribute("aria-label",theme==="dark"?"Light theme চালু করুন":"Dark theme চালু করুন");
    try{localStorage.setItem("programEntryTheme",theme)}catch(e){}
  }
  applyTheme(saved);
  btn.addEventListener("click",()=>applyTheme(root.getAttribute("data-theme")==="dark"?"light":"dark"));
})();
